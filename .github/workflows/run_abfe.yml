name: Run ABFE

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        required: true
        default: prod
        options: [dev, staging, prod]

jobs:
  run-abfe:
    environment: ${{ inputs.env }}
    runs-on: ubuntu-latest
    env:
      DO_ENV: ${{ inputs.env }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.27"
      
      - name: Set up Python
        run: uv python install
      
      - name: Select API token
        env:
          TARGET_ENV: ${{ inputs.env }}
          TOKEN_PROD: ${{ secrets.DEEPORIGIN_TOKEN_PROD }}
          TOKEN_STAGING: ${{ secrets.DEEPORIGIN_TOKEN_STAGING }}
          TOKEN_DEV: ${{ secrets.DEEPORIGIN_TOKEN_DEV }}
        run: |
          AUTH_TOKEN_VAR=$(python3 scripts/get_env_var_name.py access_token)
          if [ "$TARGET_ENV" = "prod" ]; then
            echo "${AUTH_TOKEN_VAR}=${TOKEN_PROD}" >> "$GITHUB_ENV"
          elif [ "$TARGET_ENV" = "staging" ]; then
            echo "${AUTH_TOKEN_VAR}=${TOKEN_STAGING}" >> "$GITHUB_ENV"
          elif [ "$TARGET_ENV" = "dev" ]; then
            echo "${AUTH_TOKEN_VAR}=${TOKEN_DEV}" >> "$GITHUB_ENV"
          fi

      - name: Set environment variables for Client
        env:
          TARGET_ENV: ${{ inputs.env }}
        run: |
          ORG_KEY_VAR=$(python3 scripts/get_env_var_name.py org_key)
          ENV_VAR=$(python3 scripts/get_env_var_name.py env)
          echo "${ORG_KEY_VAR}=deeporigin" >> "$GITHUB_ENV"
          echo "${ENV_VAR}=${TARGET_ENV}" >> "$GITHUB_ENV"
      
      - name: Install dependencies
        run: uv sync --extra tools --extra test --extra plots --extra core

      - name: Run ABFE unit tests
        run: uv run pytest tests/test_abfe.py -q --env ${{ inputs.env }}
