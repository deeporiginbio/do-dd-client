name: nb-clean (check)

on:
  pull_request:
    paths:
      - "**/*.ipynb"
      - "docs/notebooks/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Run nb-clean
        run: |
          uvx nb-clean clean docs/notebooks/

      - name: Fail if nb-clean would change anything
        run: |
          git diff --exit-code