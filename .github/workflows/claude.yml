name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]
  pull_request:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  # Interactive: @claude mentions in comments, PR reviews, issue triage
  interactive:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'issues'
    uses: deeporiginbio/.github/.github/workflows/claude.yml@main
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  # Inline review: triggered by requesting claude-reviewers team
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.requested_team.slug == 'claude-reviewers'
    uses: deeporiginbio/.github/.github/workflows/claude.yml@main
    with:
      prompt: "Review this pull request. Provide detailed inline comments on code quality, bugs, security issues, and suggestions for improvement."
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
