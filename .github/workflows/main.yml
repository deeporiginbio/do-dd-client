name: Test Python Code

on:
  pull_request:
    paths:
      - '**/*.py'


jobs:

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  code-formatting-syntax-and-docstrings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Check code formatting using ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.2
          args: format --check

      - name: Check import order
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.2
          args: check --select I

      - name: Lint 
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.2
          args: check 

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.27"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra test

      - name: Check docstrings using interrogate
        run: |
          if [ $(uv run interrogate -c pyproject.toml -v . -f 100 | grep "FAILED" | wc -l) = 1 ]; then
             echo "necessary docstrings missing:"
             uv run interrogate -vv -c pyproject.toml --omit-covered-files . -f 100 
             exit 1
          fi


  functionality-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    needs: [code-formatting-syntax-and-docstrings]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.27"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test --extra tools --extra plots --extra core

      - name: "run tests using a mock client"
        run: uv run pytest --env local -k test_molprops

      - name: "test docs with pytest markdown-docs"
        run: uv run pytest -x docs --env local --markdown-docs --markdown-docs-syntax=superfences 



  

