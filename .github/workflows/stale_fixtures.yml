name: Check Stale Fixtures

on:
  pull_request:
    paths:
      - "src/platform/constants.py"
      - "tests/fixtures/function-runs/**"

jobs:
  stale-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for stale function-run fixtures
        run: python3 scripts/check_stale_fixtures.py
