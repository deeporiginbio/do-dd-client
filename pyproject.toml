[project]
name = "deeporigin"
description = "Deep Origin Python client"
authors = [{ name = "Deep Origin", email = "support@deeporigin.com" }]
readme = "README.md"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "beartype",
    "cryptography",
    "httpx",
    "pyjwt",
    "tqdm",
    "typer",
]
dynamic = ["version"]

[project.scripts]
deeporigin = "deeporigin.cli:app"

[project.optional-dependencies]
core = [
    "humanize",
    "jinja2",
    "more-itertools",
    "nest_asyncio",
    "packaging",
    "pandas",
    "tabulate",
]
lint = ["ruff"]
test = [
    "pytest",
    "pytest-cov",
    "pytest-html",
    "parameterized",
    "coverage",
    "interrogate",
    "pytest-xdist",
    "pytest-markdown-docs",
    "pytest-dependency<0.6.0",
    "fastapi",
    "uvicorn[standard]",
    "nbconvert",
    "ipykernel",
]
dev = [
    "anywidget>=0.11.0",
    "ipykernel",
    "ipywidgets>=8.1.0",
    "jupyter-black",
    "jupyterlab>=4.6.2",
    "jupyterlab-execute-time",
    "python-dotenv",
]
docs = [
    "zensical",
    "mkdocstrings-python",
    "black",
    "python-dotenv",
    "nbconvert",
    "ipykernel",
]
plots = ["bokeh"]
tools = [
    "rdkit==2025.9.1",
    "deeporigin-molstar==0.1.1",
    "biotite",
    "biopython",
    "rcsb-api>=1.1.4",
    "anywidget>=0.11.0",
]


[tool.setuptools]
package-dir = { "deeporigin" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { file = ["src/VERSION"] }

[build-system]
requires = ["setuptools >= 40.9.0"]
build-backend = "setuptools.build_meta"


[tool.ruff]
include = ["**/src/**/*.py", "**/tests/**/*.py"]
fix = true

[tool.ruff.lint]
ignore = ["E203", "E266", "E501"]
select = ["E4", "E7", "E9", "F", "B", "Q", "F401", "E711", "F841", "F821", "I"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
case-sensitive = false
known-first-party = ["deeporigin"]
known-third-party = ["numpy", "pandas", "rdkit", "beartype"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-sort-within-sections = true

[tool.distutils.bdist_wheel]
universal = true

[tool.coverage.run]
omit = ["src/data_hub/client.py", "tests/*.py"]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"


[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "expects_results: marks integration tests that run tools and expect execution results (docked poses, estimates, etc.) rather than quote-only runs",
]
norecursedirs = ["notebooks", "scratch-notebooks"]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.legacy",
    "ignore::DeprecationWarning:websockets.server",
    "ignore::DeprecationWarning:uvicorn.protocols.websockets.websockets_impl",
    "ignore::DeprecationWarning:uvicorn.protocols.websockets",
]

[tool.interrogate]
fail-under = 100
# Skip files module coverage for now as it has lots of auto-gen code
exclude = [
    "setup.py",
    "docs",
    "build",
    "tests",
    "variables",
    "conftest.py",
    "src/files",
    "notebooks/*",
    "scratch-notebooks/*",
    "scripts/*",
    "scratch/*",
]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = false
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
color = true

[tool.uv.workspace]
members = ["platform-sdk"]
