<div class="deeporigin-exec-display" id="exec_disp_docking_demo">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <div class="card shadow-sm" style="max-width: 42rem;">
        <div class="card-header py-2">
            <div class="fw-semibold">Docking kras to 145 ligands.</div>
            <div class="small mt-1">
                <code class="small text-body-secondary text-break">deeporigin.docking</code>
                <span aria-hidden="true" class="text-muted">·</span>
                <span class="text-muted">v4</span>
            </div>
        </div>
        <div class="card-body py-3">
            <div class="mb-2">
                <div aria-label="Execution progress" class="progress" role="progress" style="height: 22px;">
                    <div
                        class="progress-bar"
                        data-docking-bar="0"
                        role="progressbar"
                        style="width: 0%"
                        aria-valuenow="0"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    ></div>
                </div>
            </div>
            <div class="mb-2">
                <div aria-label="Execution progress" class="progress" role="progress" style="height: 22px;">
                    <div
                        class="progress-bar"
                        data-docking-bar="1"
                        role="progressbar"
                        style="width: 0%"
                        aria-valuenow="0"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    ></div>
                </div>
            </div>
            <div class="mb-2">
                <div
                    aria-label="Execution progress (indeterminate)"
                    class="progress"
                    role="progress"
                    style="height: 22px;"
                >
                    <div
                        class="progress-bar progress-bar-striped progress-bar-animated w-100"
                        data-docking-bar="2"
                        role="progressbar"
                    ></div>
                </div>
            </div>
            <div class="mb-2">
                <div
                    aria-label="Execution progress (indeterminate)"
                    class="progress"
                    role="progress"
                    style="height: 22px;"
                >
                    <div
                        class="progress-bar progress-bar-striped progress-bar-animated w-100"
                        data-docking-bar="3"
                        role="progressbar"
                    ></div>
                </div>
            </div>
            <div class="progress" role="progress" aria-label="Execution progress (indeterminate)" style="height: 22px;">
                <div
                    class="progress-bar progress-bar-striped progress-bar-animated w-100"
                    data-docking-bar="4"
                    role="progressbar"
                ></div>
            </div>
            <div class="small text-muted mt-2 text-break"><code>63473a31-762d-44e6-86a0-bb7c4079ed73</code></div>
        </div>
        <div class="card-footer small py-2">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="d-flex align-items-center flex-wrap gap-2">
                    <div class="text-muted">Last updated: 2026-10-21 19:38:13</div>
                    <span
                        id="docking-demo-live"
                        class="d-inline-flex align-items-center gap-1 text-muted"
                        title="Refreshing automatically"
                    >
                        <span aria-hidden="true" class="spinner-border spinner-border-sm text-primary" role="status"></span>
                        <span>Live updates…</span>
                    </span>
                </div>
                <div class="d-flex align-items-center flex-wrap gap-2">
                    <span
                        class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle align-middle"
                        style="font-variant: small-caps; letter-spacing: 0.04em;"
                        title="This run includes 5 workflow child execution(s)"
                        >WORKFLOW (5x)</span>
                    <span class="badge rounded-pill bg-primary" id="docking-demo-status">Running</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            const STAGGER_MS = 1400;
            const FILL_MS = 9000;
            const bars = Array.from(document.querySelectorAll("[data-docking-bar]"));
            const statusBadge = document.getElementById("docking-demo-status");
            const liveIndicator = document.getElementById("docking-demo-live");
            const start = performance.now();

            function setCompletedBadge() {
                if (statusBadge) {
                    statusBadge.textContent = "Completed";
                    statusBadge.className = "badge rounded-pill bg-success";
                }
                if (liveIndicator) {
                    liveIndicator.remove();
                }
            }

            function setDeterminate(bar, pct) {
                const rounded = Math.min(100, Math.round(pct));
                bar.classList.remove("progress-bar-striped", "progress-bar-animated", "w-100");
                bar.style.width = rounded + "%";
                bar.setAttribute("aria-valuenow", String(rounded));
                bar.textContent = rounded + "%";
            }

            function setIndeterminate(bar) {
                bar.textContent = "";
                bar.style.width = "";
                bar.removeAttribute("aria-valuenow");
                bar.classList.add("progress-bar-striped", "progress-bar-animated", "w-100");
            }

            function tick(now) {
                const elapsed = now - start;
                let allDone = true;

                bars.forEach((bar, i) => {
                    const localStart = i * STAGGER_MS;
                    if (elapsed < localStart) {
                        setIndeterminate(bar);
                        allDone = false;
                        return;
                    }
                    const t = Math.min((elapsed - localStart) / FILL_MS, 1);
                    setDeterminate(bar, 100 * t);
                    if (t < 1) {
                        allDone = false;
                    }
                });

                if (!allDone) {
                    requestAnimationFrame(tick);
                    return;
                }

                bars.forEach((bar) => setDeterminate(bar, 100));
                setCompletedBadge();
            }

            requestAnimationFrame(tick);
        })();
    </script>
</div>
